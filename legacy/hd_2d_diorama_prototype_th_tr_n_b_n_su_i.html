<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;

        }

        }
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.18);
            height: 6px;
            border-radius: 999px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #f59e0b;

            pointer-events: none;
            transform: translateY(-8px) scale(0.98);

    <!-- Import Map for Three.js r160 & Post-Processing Addons -->
    <script type="importmap">

</head>
<body>

    <div id="dialogue-box" class="hidden fixed bottom-20 left-1/2 -translate-x-1/2 z-30 w-[92vw] max-w-xl rounded-2xl bg-slate-950/92 backdrop-blur-xl border-2 border-amber-400/75 p-4 text-slate-100 shadow-[0_0_30px_rgba(251,191,36,0.28)]">

                    <button id="dialogue-next-btn" class="px-3 py-1 rounded-lg bg-amber-500/30 hover:bg-amber-500/45 text-amber-200 border border-amber-400/50 font-medium transition cursor-pointer">

    <!-- Bottom-Left Virtual Joystick for Touch / Mobile Devices -->
    <div id="joystick-zone" class="fixed bottom-5 left-5 z-20 w-28 h-28 rounded-full bg-slate-950/45 backdrop-blur-md border border-white/20 flex items-center justify-center sm:opacity-70 hover:opacity-100 transition">
        <div class="w-12 h-12 rounded-full border border-white/15 pointer-events-none"></div>
        <div id="joystick-knob" class="absolute w-11 h-11 rounded-full bg-amber-400/80 border-2 border-amber-100 shadow-lg pointer-events-none transition-transform duration-75"></div>
    </div>

    <!-- Bottom-Center Camera Mode Switcher -->
    <div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-20 flex items-center gap-1.5 p-1.5 rounded-2xl bg-slate-950/70 backdrop-blur-md border border-white/15 shadow-xl">
        <button id="cam-follow-btn" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-amber-500/35 border border-amber-400/70 text-amber-200 transition cursor-pointer">
            Camera theo nhân vật

        <button id="cam-free-btn" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-transparent hover:bg-white/10 border border-transparent text-slate-300 transition cursor-pointer">
            Camera tự do

    <!-- Main 3D & HD-2D Application Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // =========================================================================
        // 1. HIGH-DETAIL PROCEDURAL PIXEL ART TEXTURE GENERATOR (32x32 & 64x64)
        // =========================================================================
        function createPixelCanvas(w, h) {
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            return { canvas, ctx };
        }

        function canvasToPixelTexture(canvas, repeatX = 1, repeatY = 1) {
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            tex.colorSpace = THREE.SRGBColorSpace;
            if (repeatX > 1 || repeatY > 1) {
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(repeatX, repeatY);
            }
            return tex;
        }

        // 1A. Lush Meadow Grass Texture (32x32)
        function generateGrassTexture() {
            const { canvas, ctx } = createPixelCanvas(32, 32);
            ctx.fillStyle = '#4d8b31';
            ctx.fillRect(0, 0, 32, 32);
            for (let y = 0; y < 32; y++) {
                for (let x = 0; x < 32; x++) {
                    const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
                    const r = n - Math.floor(n);
                    if (r < 0.22) {
                        ctx.fillStyle = '#3e7326';
                        ctx.fillRect(x, y, 1, 1);
                    } else if (r > 0.78) {
                        ctx.fillStyle = '#65a30d';
                        ctx.fillRect(x, y, 1, 1);
                    } else if (r > 0.72 && r <= 0.76) {
                        ctx.fillStyle = '#84cc16';
                        ctx.fillRect(x, y, 1, 2);
                    }
                }
            }
            const flowers = [
                [5, 6, '#fef08a'], [18, 12, '#ffffff'], [26, 24, '#f472b6'],
                [10, 27, '#fef08a'], [22, 4, '#93c5fd']
            ];
            flowers.forEach(([fx, fy, col]) => {
                ctx.fillStyle = col;
                ctx.fillRect(fx, fy, 2, 2);
            });
            return canvasToPixelTexture(canvas, 22, 22);
        }

        // 1B. Cobblestone Pathway Texture (32x32)
        function generateCobblestoneTexture() {
            const { canvas, ctx } = createPixelCanvas(32, 32);
            ctx.fillStyle = '#64748b';
            ctx.fillRect(0, 0, 32, 32);
            const stones = [
                [1, 1, 6, 5, '#cbd5e1', '#94a3b8'], [8, 1, 7, 6, '#e2e8f0', '#94a3b8'],
                [16, 1, 6, 5, '#cbd5e1', '#64748b'], [23, 1, 8, 6, '#cbd5e1', '#94a3b8'],
                [1, 7, 8, 6, '#e2e8f0', '#94a3b8'], [10, 8, 6, 5, '#cbd5e1', '#64748b'],
                [17, 7, 7, 6, '#e2e8f0', '#94a3b8'], [25, 8, 6, 5, '#cbd5e1', '#94a3b8'],
                [1, 14, 6, 6, '#cbd5e1', '#94a3b8'], [8, 14, 8, 5, '#e2e8f0', '#94a3b8'],
                [17, 14, 6, 6, '#cbd5e1', '#64748b'], [24, 14, 7, 6, '#e2e8f0', '#94a3b8'],
                [1, 21, 7, 5, '#e2e8f0', '#94a3b8'], [9, 20, 6, 6, '#cbd5e1', '#94a3b8'],
                [16, 21, 8, 5, '#cbd5e1', '#64748b'], [25, 21, 6, 5, '#e2e8f0', '#94a3b8'],
                [1, 27, 8, 4, '#cbd5e1', '#94a3b8'], [10, 27, 7, 4, '#e2e8f0', '#94a3b8'],
                [18, 27, 6, 4, '#cbd5e1', '#94a3b8'], [25, 27, 6, 4, '#cbd5e1', '#64748b']
            ];
            stones.forEach(([x, y, w, h, topCol, shadowCol]) => {
                ctx.fillStyle = shadowCol;
                ctx.fillRect(x, y, w, h);
                ctx.fillStyle = topCol;
                ctx.fillRect(x, y, w - 1, h - 1);
            });
            return canvasToPixelTexture(canvas, 14, 4);
        }

        // 1C. Scalloped Terracotta / Slate Roof Tile Texture (32x32)
        function generateRoofTexture(baseHex, highlightHex, shadowHex) {
            const { canvas, ctx } = createPixelCanvas(32, 32);
            ctx.fillStyle = baseHex;
            ctx.fillRect(0, 0, 32, 32);
            for (let row = 0; row < 8; row++) {
                const y = row * 4;
                const offset = (row % 2) * 2;
                ctx.fillStyle = shadowHex;
                ctx.fillRect(0, y + 3, 32, 1);
                for (let col = -1; col < 9; col++) {
                    const x = col * 4 + offset;
                    ctx.fillStyle = highlightHex;
                    ctx.fillRect(x + 1, y, 2, 1);
                    ctx.fillStyle = shadowHex;
                    ctx.fillRect(x, y + 1, 1, 2);
                }
            }
            return canvasToPixelTexture(canvas, 3, 3);
        }

        // 1D. Half-Timbered Cottage Wall Texture (32x32)
        function generateTimberWallTexture() {
            const { canvas, ctx } = createPixelCanvas(32, 32);
            ctx.fillStyle = '#f5ebd6';
            ctx.fillRect(0, 0, 32, 32);
            ctx.fillStyle = '#e6d5b8';
            for (let y = 0; y < 32; y += 2) {
                for (let x = (y % 4 === 0 ? 0 : 1); x < 32; x += 3) {
                    ctx.fillRect(x, y, 1, 1);
                }
            }
            ctx.fillStyle = '#5c3a21';
            ctx.fillRect(0, 0, 32, 3);
            ctx.fillRect(0, 29, 32, 3);
            ctx.fillRect(0, 0, 3, 32);
            ctx.fillRect(29, 0, 3, 32);
            ctx.fillRect(15, 0, 2, 32);
            ctx.fillStyle = '#784b2a';
            ctx.fillRect(1, 1, 30, 1);
            ctx.fillRect(1, 1, 1, 30);
            return canvasToPixelTexture(canvas, 1, 1);
        }

        // 1E. Stone Embankment Wall Texture (32x32)
        function generateStoneWallTexture() {
            const { canvas, ctx } = createPixelCanvas(32, 32);
            ctx.fillStyle = '#475569';
            ctx.fillRect(0, 0, 32, 32);
            for (let row = 0; row < 4; row++) {
                const y = row * 8;
                const shift = (row % 2) * 4;
                for (let col = -1; col < 5; col++) {
                    const x = col * 8 + shift;
                    ctx.fillStyle = '#94a3b8';
                    ctx.fillRect(x + 1, y + 1, 6, 6);
                    ctx.fillStyle = '#cbd5e1';
                    ctx.fillRect(x + 1, y + 1, 5, 1);
                }
            }
            return canvasToPixelTexture(canvas, 1, 14);
        }

        // 1F. 1:2 Chibi Pixel Art Traveler Sprite Sheet (32x32: Idle & 4-Frame Walk Cycle)
        function generateHeroAnimations(customPalette = null) {
            const palette = Object.assign({
                'O': '#1e1b18', // Dark pixel outline
                'H': '#b45309', // Warm chestnut hair
                'h': '#f59e0b', // Hair highlight
                'd': '#78350f', // Hair shadow
                'S': '#fde68a', // Warm skin tone
                's': '#f59e0b', // Cheek / chin shadow
                'W': '#ffffff', // Eye sparkle
                'R': '#dc2626', // Crimson traveler scarf
                'r': '#991b1b', // Scarf shadow
                'B': '#2563eb', // Royal blue tunic
                'b': '#1d4ed8', // Tunic shadow
                'G': '#fbbf24', // Gold belt & trim
                'L': '#5c3a21', // Leather boots
                'l': '#855834'  // Boot highlight
            }, customPalette || {});

            const headRows = [
                '...........OOOOOOOOOO...........',
                '.........OOHHHHHHHHHHOO.........',
                '........OHHhhhhhhhhhhHHO........',
                '.......OHhhHHHHHHHHHHhhHO.......',
                '......OHhHHHHHHHHHHHHHHhHO......',
                '......OHHHHHHHHHHHHHHHHHHO......',
                '.....OHHdHHHHHHHHHHHHHHdHHO.....',
                '.....OHdHSSSSSSSSSSSSSSHdHO.....',
                '.....OHdSSSSSSSSSSSSSSSSdHO.....',
                '......OSSSSSSSSSSSSSSSSSSO......',
                '......OSSSSOOSSSSSSOOSSSSO......',
                '......OSSSSWOSSSSSSWOSSSSO......',
                '......OSSSSOOSSSSSSOOSSSSO......',
                '......OSSsSSSSSSSSSSSSsSSO......',
                '.......OSSSSSSSSSSSSSSSSO.......',
                '........OOSSSSSSSSSSSSOO........'
            ];

            const torsoRows = [
                '........OORRRRRRRRRRRROO........',
                '.......ORRrRRRRRRRRRRrRRO.......',
                '......OORRRRRRRRRRRRRRRROO......',
                '.....OSSOOBBBBBBBBBBBBOOSSO.....',
                '.....OSSOOBBBBGGBBBBBBOOSSO.....',
                '.....OSSOOBBBBBBBBBBBBOOSSO.....',
                '......OO.OOBBBBBBBBBBOO.OO......',
                '.........OOGGGGGGGGGGOO.........'
            ];

            const legsIdle = [
                '.........OObBBBBBBBbbOO.........',
                '.........OObBBBOOBBbbOO.........',
                '.........OOLLLO..OLLLOO.........',
                '.........OLllLO..OLllLO.........',
                '........OOLLLLO..OLLLLOO........',
                '........OOOOOOO..OOOOOOO........'
            ];

            const legsWalk1 = [
                '........OObBBBB..BBBBbOO........',
                '.......OObBBBOO..OOBBBbOO.......',
                '......OOLLLOO......OOLLLOO......',
                '.....OLllLO..........OLllLO.....',
                '.....OOOOOO..........OOOOOO.....',
                '................................'
            ];

            const legsWalk2 = [
                '.........OObBBBBBBBbbOO.........',
                '.........OObBBBOOBBbbOO.........',
                '..........OOLLLOOLLLOO..........',
                '..........OLllLOOLllLO..........',
                '..........OOOOOOOOOOOO..........',
                '................................'
            ];

            const legsWalk3 = [
                '........OObBBBB..BBBBbOO........',
                '.......OObBBBOO..OOBBBbOO.......',
                '......OOLLLOO......OOLLLOO......',
                '......OLllLO........OLllLO......',
                '......OOOOOO........OOOOOO......',
                '................................'
            ];

            function buildFrame(headOffsetY, legRows) {
                const { canvas, ctx } = createPixelCanvas(32, 32);
                const rows = [];
                for (let i = 0; i < headOffsetY; i++) rows.push('................................');
                rows.push(...headRows, ...torsoRows, ...legRows);
                while (rows.length < 32) rows.push('................................');

                for (let y = 0; y < 32; y++) {
                    const row = rows[y] || '';
                    for (let x = 0; x < 32; x++) {
                        const ch = row[x];
                        if (ch && palette[ch]) {
                            ctx.fillStyle = palette[ch];
                            ctx.fillRect(x, y, 1, 1);
                        }
                    }
                }
                return canvasToPixelTexture(canvas);
            }

            return {
                idle: [buildFrame(1, legsIdle), buildFrame(2, legsIdle)],
                walk: [
                    buildFrame(1, legsWalk1),
                    buildFrame(2, legsWalk2),
                    buildFrame(1, legsWalk3),
                    buildFrame(2, legsWalk2)
                ]
            };
        }

        // 1G. Detailed Pixel Foliage Cluster Texture (32x32)
        function generateFoliageTexture(isSakura = false) {
            const { canvas, ctx } = createPixelCanvas(32, 32);
            const cDark  = isSakura ? '#be185d' : '#166534';
            const cMid   = isSakura ? '#ec4899' : '#22c55e';
            const cLight = isSakura ? '#f9a8d4' : '#86efac';
            const cOut   = isSakura ? '#831843' : '#14532d';

            const cx = 16, cy = 16;
            for (let y = 0; y < 32; y++) {
                for (let x = 0; x < 32; x++) {
                    const dx = x - cx;
                    const dy = y - cy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const n = Math.sin(x * 1.9 + y * 2.3) * 1.6;
                    if (dist + n < 13.5) {
                        if (dist + n > 11.8) {
                            ctx.fillStyle = cOut;
                        } else if (dy < -3 && dx < 4) {
                            ctx.fillStyle = cLight;
                        } else if (dy > 4 || dx > 5) {
                            ctx.fillStyle = cDark;
                        } else {
                            ctx.fillStyle = cMid;
                        }
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }
            return canvasToPixelTexture(canvas);
        }

        // 1H. Flower Bush Sprite Texture (24x24)
        function generateBushSpriteTexture(hasFlowers = true) {
            const { canvas, ctx } = createPixelCanvas(24, 24);
            for (let y = 4; y < 22; y++) {
                for (let x = 2; x < 22; x++) {
                    const dx = (x - 12) / 9.5;
                    const dy = (y - 14) / 7.5;
                    const d = dx * dx + dy * dy + Math.sin(x * 2.1 + y) * 0.15;
                    if (d < 1.0) {
                        ctx.fillStyle = d > 0.82 ? '#14532d' : (y < 12 ? '#4ade80' : '#16a34a');
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }
            if (hasFlowers) {
                const spots = [[7, 10, '#fef08a'], [14, 9, '#f472b6'], [11, 14, '#ffffff'], [16, 15, '#fef08a'], [6, 15, '#f472b6']];
                spots.forEach(([fx, fy, col]) => {
                    ctx.fillStyle = col;
                    ctx.fillRect(fx, fy, 2, 2);
                });
            }
            return canvasToPixelTexture(canvas);
        }

        // 1I. Soft Volumetric Mist Sprite Texture (64x64)
        function generateMistTexture() {
            const { canvas, ctx } = createPixelCanvas(64, 64);
            const grad = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.32)');
            grad.addColorStop(0.5, 'rgba(226, 232, 240, 0.14)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // =========================================================================
        // 2. THREE.JS SCENE, BRIGHT DAYLIGHT & CAMERA SETUP

        const container = document.getElementById('canvas-container');

        camFreeBtn.addEventListener('click', () => setCameraMode('free'));

        // Bright & Rich Multi-Layer Lighting System
        const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x65a30d, 1.55);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e4, 2.75);
        dirLight.position.set(-14, 20, 12);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;

        dirLight.shadow.camera.left = -d;

        dirLight.shadow.camera.bottom = -d;

        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x93c5fd, 0.85);
        fillLight.position.set(14, 10, -10);
        scene.add(fillLight);

        const lightningLight = new THREE.PointLight(0xe0f2fe, 0, 80, 1.2);
        lightningLight.position.set(0, 22, -12);
        scene.add(lightningLight);

        // =========================================================================
        // 3. REALISTIC REFLECTIVE STREAM SHADER (WITH RAINDROP RIPPLES & FESTIVAL GLOW)
        // =========================================================================
        const waterUniforms = {
            uTime: { value: 0 },
            uDeepColor: { value: new THREE.Color(0x0f4c68) },
            uShallowColor: { value: new THREE.Color(0x2a859e) },
            uSunColor: { value: new THREE.Color(0xfff3c4) },
            uLanternColor: { value: new THREE.Color(0xffa938) },
            uLanternIntensity: { value: 0.45 },
            uRainIntensity: { value: 0.0 },
            uFestivalIntensity: { value: 0.0 }
        };

        const waterMat = new THREE.ShaderMaterial({
            uniforms: waterUniforms,
            transparent: true,
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vWorldPos;
                void main() {
                    vUv = uv;
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPos = worldPosition.xyz;
                    gl_Position = projectionMatrix * viewMatrix * worldPosition;
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform vec3 uDeepColor;
                uniform vec3 uShallowColor;
                uniform vec3 uSunColor;
                uniform vec3 uLanternColor;
                uniform float uLanternIntensity;
                uniform float uRainIntensity;
                uniform float uFestivalIntensity;
                varying vec2 vUv;
                varying vec3 vWorldPos;

                float hash21(vec2 p) {
                    p = fract(p * vec2(123.34, 456.21));
                    p += dot(p, p + 45.32);
                    return fract(p.x * p.y);
                }

                float rainRipples(vec2 uv, float t) {
                    vec2 grid = uv * 2.6;
                    vec2 id = floor(grid);
                    vec2 f = fract(grid) - 0.5;
                    float h = hash21(id);
                    float cycle = fract(t * 1.15 + h * 7.0);
                    float dist = length(f - (vec2(h, fract(h * 13.7)) - 0.5) * 0.45);
                    float ring = 1.0 - smoothstep(0.0, 0.035, abs(dist - cycle * 0.42));
                    return ring * (1.0 - cycle) * step(0.35, h);
                }

                void main() {
                    float bankProximity = clamp(abs(vUv.x - 0.5) * 2.0, 0.0001, 1.0);
                    vec3 waterCol = mix(uDeepColor, uShallowColor, pow(bankProximity, 1.35));

                    // Organic flowing horizontal stream ripples (replaces grid polka-dots)
                    float flowZ = vWorldPos.z - uTime * 1.35;
                    float waveA = sin(flowZ * 4.2 + sin(vWorldPos.x * 1.8 + uTime * 0.8) * 1.4);
                    float waveB = sin(flowZ * 9.5 - vWorldPos.x * 2.4 + uTime * 1.1) * 0.5;
                    float waveC = cos(flowZ * 16.0 + vWorldPos.x * 3.2) * 0.25;
                    float combinedWave = waveA * 0.55 + waveB * 0.3 + waveC * 0.15;

                    // Soft horizontal water caustics & sky reflection bands
                    float causticBand = smoothstep(0.25, 0.85, combinedWave);
                    waterCol = mix(waterCol, uShallowColor * 1.28 + vec3(0.08, 0.15, 0.18), causticBand * 0.55);

                    // Natural foamy water edge along stone embankments
                    float edgeFoam = smoothstep(0.84, 0.99, bankProximity + combinedWave * 0.035);
                    waterCol = mix(waterCol, vec3(0.92, 0.97, 1.0), edgeFoam * 0.65);

                    // Soft shadows under South Bridge (z=0.6) and North Festival Bridge (z=-10.2)
                    float bridgeShadow1 = exp(-pow((vWorldPos.z - 0.6) * 1.15, 2.0));
                    float bridgeShadow2 = exp(-pow((vWorldPos.z + 10.2) * 1.15, 2.0));
                    waterCol *= (1.0 - max(bridgeShadow1, bridgeShadow2) * 0.36);

                    // Crisp HD-2D horizontal sun/moon glints drifting downstream
                    vec2 glintCell = floor(vec2(vWorldPos.x * 9.0, (vWorldPos.z - uTime * 0.85) * 22.0));
                    float glintNoise = hash21(glintCell);
                    float glintPulse = sin(uTime * 3.8 + glintNoise * 31.0) * 0.5 + 0.5;
                    float centerBand = exp(-pow(vWorldPos.x * 0.68, 2.0));
                    float sparkle = step(0.935, glintNoise) * smoothstep(0.55, 0.95, glintPulse) * centerBand * (1.0 - uRainIntensity * 0.7);
                    waterCol += uSunColor * sparkle * 1.1;

                    // Raindrop expanding splash rings if raining
                    if (uRainIntensity > 0.01) {
                        float drops = rainRipples(vWorldPos.xz, uTime);
                        waterCol += mix(vec3(0.75, 0.9, 1.0), uLanternColor, 0.3) * drops * uRainIntensity * 0.85;
                    }

                    // Warm lantern reflections
                    float lampGlow1 = exp(-length(vec2((vWorldPos.x + 2.3) * 1.3, (vWorldPos.z - 2.3) * 0.45)));
                    float lampGlow2 = exp(-length(vec2((vWorldPos.x - 2.3) * 1.3, (vWorldPos.z - 2.3) * 0.45)));
                    float lampGlow3 = exp(-length(vec2((vWorldPos.x + 2.3) * 1.3, (vWorldPos.z + 2.2) * 0.45)));
                    float lampGlow4 = exp(-length(vec2((vWorldPos.x - 2.3) * 1.3, (vWorldPos.z + 10.2) * 0.45)));
                    float rippleMod = 0.75 + 0.25 * sin(vWorldPos.z * 12.0 - uTime * 3.5);
                    float rainBoost = 1.0 + uRainIntensity * 0.55;
                    waterCol += uLanternColor * (lampGlow1 + lampGlow2 + lampGlow3 + lampGlow4) * rippleMod * uLanternIntensity * rainBoost;

                    // Vibrant Multicolor Festival Lantern Reflections on Water at Night
                    if (uFestivalIntensity > 0.01) {
                        float festWave = sin(vWorldPos.z * 2.2 + uTime * 2.5) * 0.5 + 0.5;
                        vec3 festColor = mix(vec3(1.0, 0.28, 0.45), vec3(0.25, 0.95, 0.85), festWave);
                        festColor = mix(festColor, vec3(1.0, 0.82, 0.22), sin(vWorldPos.x * 3.0 - uTime * 3.0) * 0.5 + 0.5);
                        float festBand = exp(-pow(vWorldPos.x * 0.55, 2.0)) * (0.55 + 0.45 * sin(vWorldPos.z * 9.0 - uTime * 5.0));
                        waterCol += festColor * festBand * uFestivalIntensity * 0.75;
                    }

                    gl_FragColor = vec4(waterCol, 0.93);
                }
            `
        });

        // =========================================================================
        // 4. EXPANDED 4X TOWN TERRAIN, DOUBLE BRIDGES, WET COBBLESTONES & COLLIDERS
        // =========================================================================
        const grassTex = generateGrassTexture();
        const cobbleTex = generateCobblestoneTexture();
        const stoneWallTex = generateStoneWallTexture();

        const grassMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.85, metalness: 0.04 });
        const cobbleMat = new THREE.MeshStandardMaterial({ map: cobbleTex, roughness: 0.82, metalness: 0.06 });
        const stoneWallMat = new THREE.MeshStandardMaterial({ map: stoneWallTex, roughness: 0.8 });
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x855834, roughness: 0.75 });
        const timberMat = new THREE.MeshStandardMaterial({ color: 0x4a2e18, roughness: 0.8 });

        const solidColliders = [];
        function addCollider(minX, maxX, minZ, maxZ) {
            solidColliders.push({ minX, maxX, minZ, maxZ });
        }

        function getWalkableSurfaceY(x, z) {
            if (x < -21.5 || x > 21.5 || z < -19.5 || z > 14.5) return null;

            if (Math.abs(x) <= 2.7 && z >= -0.45 && z <= 1.65) {
                const progress = (x + 2.7) / 5.4;
                return 0.25 + Math.sin(progress * Math.PI) * 0.45;
            }

            if (Math.abs(x) <= 2.7 && z >= -11.25 && z <= -9.15) {
                const progress = (x + 2.7) / 5.4;
                return 0.25 + Math.sin(progress * Math.PI) * 0.45;
            }

            if (Math.abs(x) < 2.45) {
                return null;
            }

            const radius = 0.28;
            for (let i = 0; i < solidColliders.length; i++) {
                const c = solidColliders[i];
                if (x + radius > c.minX && x - radius < c.maxX && z + radius > c.minZ && z - radius < c.maxZ) {
                    return null;
                }
            }

            return 0.20;
        }

        // West & East Bank Terrains (4x Expanded World)
        const leftBank = new THREE.Mesh(new THREE.BoxGeometry(26, 1.4, 44), grassMat);
        leftBank.position.set(-15.4, -0.5, -3);
        leftBank.receiveShadow = true;
        scene.add(leftBank);

        const rightBank = new THREE.Mesh(new THREE.BoxGeometry(26, 1.4, 44), grassMat);
        rightBank.position.set(15.4, -0.5, -3);
        rightBank.receiveShadow = true;
        scene.add(rightBank);

        // Stone Embankment Walls
        const leftRetainingWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.45, 44), stoneWallMat);
        leftRetainingWall.position.set(-2.4, -0.48, -3);
        leftRetainingWall.receiveShadow = true;
        scene.add(leftRetainingWall);

        const rightRetainingWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.45, 44), stoneWallMat);
        rightRetainingWall.position.set(2.4, -0.48, -3);
        rightRetainingWall.receiveShadow = true;
        scene.add(rightRetainingWall);

        // Riverbed & Water Surface
        const riverBed = new THREE.Mesh(
            new THREE.BoxGeometry(6, 0.5, 44),

        );
        riverBed.position.set(0, -1.1, -3);

        const waterSurface = new THREE.Mesh(new THREE.PlaneGeometry(5.0, 44, 48, 48), waterMat);
        waterSurface.rotation.x = -Math.PI / 2;
        waterSurface.position.set(0, -0.42, -3);
        scene.add(waterSurface);

        // Cobblestone Roads & Plazas
        const walkableFloors = [leftBank, rightBank];

        function createCobblePlaza(x, z, w, d) {
            const plaza = new THREE.Mesh(new THREE.BoxGeometry(w, 0.04, d), cobbleMat);
            plaza.position.set(x, 0.21, z);
            plaza.receiveShadow = true;
            scene.add(plaza);
            walkableFloors.push(plaza);
        }

        createCobblePlaza(0, 0.6, 42, 3.2);
        createCobblePlaza(0, -10.2, 42, 3.0);
        createCobblePlaza(-3.8, -4.5, 2.8, 28);

        createCobblePlaza(12.5, -4.5, 11.0, 10.5);
        createCobblePlaza(-12.5, -8.5, 9.5, 7.5);
        createCobblePlaza(11.5, 4.8, 9.0, 7.5);
        createCobblePlaza(0, 6.8, 24.0, 4.5);

        // Helper to build Arched Wooden Bridges
        function buildArchedBridge(centerZ) {
            const bridgeGroup = new THREE.Group();
            const plankCount = 14;
            for (let i = 0; i < plankCount; i++) {
                const t = i / (plankCount - 1);
                const px = -2.6 + t * 5.2;
                const archY = Math.sin(t * Math.PI) * 0.45;
                const plank = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.14, 2.5), woodMat);
                plank.position.set(px, 0.25 + archY, centerZ);
                plank.castShadow = true;
                plank.receiveShadow = true;
                bridgeGroup.add(plank);
                walkableFloors.push(plank);
            }
            [centerZ - 1.1, centerZ + 1.1].forEach(zPos => {
                [-2.4, -1.2, 0, 1.2, 2.4].forEach(xPos => {
                    const t = (xPos + 2.6) / 5.2;
                    const archY = Math.sin(t * Math.PI) * 0.45;
                    const post = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.72, 0.16), timberMat);
                    post.position.set(xPos, 0.58 + archY, zPos);
                    post.castShadow = true;
                    bridgeGroup.add(post);
                });
                const rail = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.12, 0.14), woodMat);
                rail.position.set(0, 0.96, zPos);
                rail.castShadow = true;
                bridgeGroup.add(rail);
            });
            scene.add(bridgeGroup);
        }

        buildArchedBridge(0.6);
        buildArchedBridge(-10.2);

        // =========================================================================
        // 5. DETAILED EUROPEAN TIMBER COTTAGES, SHRINE, MARKET & STREET LANTERNS
        // =========================================================================
        const wallTex = generateTimberWallTexture();
        const roofRedTex = generateRoofTexture('#b94a3e', '#d96b5f', '#7c2d25');
        const roofSlateTex = generateRoofTexture('#3b526b', '#587594', '#233242');

        const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.85 });
        const roofRedMat = new THREE.MeshStandardMaterial({ map: roofRedTex, roughness: 0.75 });
        const roofSlateMat = new THREE.MeshStandardMaterial({ map: roofSlateTex, roughness: 0.75 });

        const windowGlassMat = new THREE.MeshStandardMaterial({
            color: 0xfef08a,
            emissive: 0xffa726,
            emissiveIntensity: 0.65,
            roughness: 0.2
        });

        function buildTownHouse({ x, z, w, h, d, rotY, roofMat, hasAwning = false }) {
            const house = new THREE.Group();
            house.position.set(x, 0.2, z);
            house.rotation.y = rotY;

            const foundation = new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, 0.35, d + 0.2), stoneWallMat);
            foundation.position.y = 0.175;
            foundation.castShadow = true;
            foundation.receiveShadow = true;
            house.add(foundation);

            const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
            body.position.y = 0.35 + h / 2;
            body.castShadow = true;
            body.receiveShadow = true;
            house.add(body);

            const roofHeight = h * 0.65;
            const roofGeo = new THREE.ConeGeometry(Math.max(w, d) * 0.78, roofHeight, 4);
            roofGeo.rotateY(Math.PI / 4);
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = 0.35 + h + roofHeight / 2 - 0.05;
            roof.scale.set(w / Math.max(w, d) * 1.08, 1, d / Math.max(w, d) * 1.08);
            roof.castShadow = true;
            house.add(roof);

            const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.45, roofHeight * 0.9, 0.45), stoneWallMat);
            chimney.position.set(w * 0.28, 0.35 + h + roofHeight * 0.45, -d * 0.22);
            chimney.castShadow = true;
            house.add(chimney);

            const door = new THREE.Mesh(new THREE.BoxGeometry(0.68, 1.25, 0.12), timberMat);
            door.position.set(0, 0.35 + 0.625, d / 2 + 0.02);
            house.add(door);

            [-w * 0.28, w * 0.28].forEach(wx => {
                const frame = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.66, 0.12), timberMat);
                frame.position.set(wx, 0.35 + h * 0.56, d / 2 + 0.02);
                house.add(frame);

                const glass = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.52, 0.14), windowGlassMat);
                glass.position.set(wx, 0.35 + h * 0.56, d / 2 + 0.03);
                house.add(glass);

                const planter = new THREE.Mesh(new THREE.BoxGeometry(0.64, 0.16, 0.22), woodMat);
                planter.position.set(wx, 0.35 + h * 0.56 - 0.38, d / 2 + 0.08);
                house.add(planter);

                const blooms = new THREE.Mesh(
                    new THREE.BoxGeometry(0.58, 0.14, 0.18),
                    new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.9 })
                );
                blooms.position.set(wx, 0.35 + h * 0.56 - 0.26, d / 2 + 0.08);
                house.add(blooms);
            });

            if (hasAwning) {
                const awning = new THREE.Mesh(
                    new THREE.BoxGeometry(w * 0.85, 0.08, 0.95),
                    new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.8 })
                );
                awning.position.set(0, 0.35 + 1.38, d / 2 + 0.42);
                awning.rotation.x = 0.28;
                awning.castShadow = true;
                house.add(awning);
            }

            scene.add(house);
            addCollider(x - w * 0.52, x + w * 0.52, z - d * 0.52, z + d * 0.52);
            return house;
        }

        // Core Riverside Cottages
        buildTownHouse({ x: -7.0, z: -2.6, w: 3.4, h: 2.7, d: 3.0, rotY: 0.22, roofMat: roofRedMat, hasAwning: true });
        buildTownHouse({ x: -6.2, z: -6.4, w: 3.0, h: 2.4, d: 2.8, rotY: 0.12, roofMat: roofSlateMat });
        buildTownHouse({ x: 7.0, z: -2.4, w: 3.5, h: 2.8, d: 3.1, rotY: -0.25, roofMat: roofSlateMat });
        buildTownHouse({ x: 6.3, z: -6.3, w: 3.1, h: 2.5, d: 2.7, rotY: -0.1, roofMat: roofRedMat, hasAwning: true });

        // Expanded West Market District & North Highlands Houses (4x Map Expansion)
        buildTownHouse({ x: -13.5, z: -3.2, w: 3.8, h: 3.1, d: 3.2, rotY: 0.18, roofMat: roofRedMat, hasAwning: true });

            fwState.origin.set((Math.random() - 0.5) * 22, 8.5 + Math.random() * 4.5, -12 - Math.random() * 10);

            const baseCol = new THREE.Color(festivalColors[Math.floor(Math.random() * festivalColors.length)]);

            for (let i = 0; i < fwSparkCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const spd = 2.2 + Math.random() * 3.4;
                fwState.velocities.push(new THREE.Vector3(
                    Math.sin(phi) * Math.cos(theta) * spd,
                    Math.cos(phi) * spd,
                    Math.sin(phi) * Math.sin(theta) * spd

                fwPositions[i * 3] = fwState.origin.x;
                fwPositions[i * 3 + 1] = fwState.origin.y;
                fwPositions[i * 3 + 2] = fwState.origin.z;
                const c = i % 3 === 0 ? altCol : baseCol;
                fwColors[i * 3] = c.r;
                fwColors[i * 3 + 1] = c.g;
                fwColors[i * 3 + 2] = c.b;

        function triggerInteraction() {
            if (activeDialogue) {
                if (activeDialogue.charIdx < activeDialogue.fullText.length) {
                    activeDialogue.charIdx = activeDialogue.fullText.length;
                    dialogueTextEl.textContent = activeDialogue.fullText;
                    return;
                }
                activeDialogue.lineIdx++;
                if (activeDialogue.lineIdx < activeDialogue.npc.lines.length) {
                    activeDialogue.fullText = activeDialogue.npc.lines[activeDialogue.lineIdx];
                    activeDialogue.charIdx = 0;
                    dialogueTextEl.textContent = '';
                } else {
                    activeDialogue = null;
                    dialogueBoxEl.classList.add('hidden');
                }
                return;
            }

            if (!nearestInteractable) return;

            if (nearestInteractable.type === 'npc') {
                const npc = nearestInteractable.target;
                npc.facing = heroPivot.position.x < npc.x ? -1 : 1;
                activeDialogue = {
                    npc,
                    lineIdx: 0,
                    fullText: npc.lines[0],
                    charIdx: 0,
                    timer: 0
                };
                dialogueSpeakerEl.textContent = npc.name;
                dialogueRoleEl.textContent = npc.role;
                dialogueTextEl.textContent = '';
                renderPortrait(npc);
                dialogueBoxEl.classList.remove('hidden');
                interactHintEl.classList.add('hidden');
            } else if (nearestInteractable.type === 'lamp') {
                const lamp = nearestInteractable.target;
                lamp.isOn = !lamp.isOn;
                spawnFootstepDust(lamp.x, 1.8, lamp.z);
            }
        }

            const moveDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            if (moveDist > 6) return;

            pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointerNDC, camera);

            const hits = raycaster.intersectObjects(walkableFloors, false);
            if (hits.length > 0) {
                const pt = hits[0].point;
                const validY = getWalkableSurfaceY(pt.x, pt.z);
                if (validY !== null) {
                    clickTarget = new THREE.Vector3(pt.x, validY, pt.z);
                    targetRing.position.set(pt.x, validY + 0.03, pt.z);
                    targetRing.visible = true;
                }
            }
        });

        // Virtual Touch Joystick Controller
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickInput = { x: 0, z: 0 };
        let joystickActive = false;

        function updateJoystick(clientX, clientY) {
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const maxR = rect.width * 0.36;
            let dx = clientX - centerX;
            let dy = clientY - centerY;
            const dist = Math.hypot(dx, dy);
            if (dist > maxR) {
                dx = (dx / dist) * maxR;
                dy = (dy / dist) * maxR;
            }
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joystickInput.x = dx / maxR;
            joystickInput.z = dy / maxR;
            if (dist > 4) {
                clickTarget = null;
                targetRing.visible = false;
            }
        }

        joystickZone.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            joystickActive = true;
            joystickZone.setPointerCapture(e.pointerId);
            updateJoystick(e.clientX, e.clientY);
        });
        joystickZone.addEventListener('pointermove', (e) => {
            if (!joystickActive) return;
            e.stopPropagation();
            updateJoystick(e.clientX, e.clientY);
        });
        function resetJoystick() {
            joystickActive = false;
            joystickInput = { x: 0, z: 0 };
            joystickKnob.style.transform = 'translate(0px, 0px)';
        }
        joystickZone.addEventListener('pointerup', resetJoystick);
        joystickZone.addEventListener('pointercancel', resetJoystick);

        const raysGroup = new THREE.Group();

        const rayMat = new THREE.ShaderMaterial({
            uniforms: rayUniforms,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform vec3 uColor;
                uniform float uOpacity;
                varying vec2 vUv;
                void main() {
                    float edgeFade = max(sin(vUv.x * 3.14159265), 0.0);
                    edgeFade = pow(edgeFade, 1.7);
                    float verticalFade = smoothstep(0.0, 0.25, vUv.y) * (1.0 - smoothstep(0.15, 1.0, vUv.y));
                    float shimmer = 0.8 + 0.2 * sin(vUv.x * 16.0 + uTime * 1.1);
                    gl_FragColor = vec4(uColor, edgeFade * verticalFade * shimmer * uOpacity);
                }
            `
        });

        [
            [-6.5, 6.2, -3.5, 4.5, 16, -0.36],
            [-1.5, 7.0, -2.0, 5.2, 17, -0.34],

        const TiltShiftShader = {
            uniforms: {
                tDiffuse: { value: null },
                uFocusY: { value: 0.46 },
                uBlurStrength: { value: 0.0009 },
                uAspect: { value: window.innerWidth / window.innerHeight }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uFocusY;
                uniform float uBlurStrength;
                uniform float uAspect;
                varying vec2 vUv;

                void main() {
                    float dist = abs(vUv.y - uFocusY);
                    float blurAmt = smoothstep(0.34, 0.52, dist) * uBlurStrength;

                    vec4 sum = vec4(0.0);
                    vec2 offX = vec2(blurAmt / uAspect, 0.0);
                    vec2 offY = vec2(0.0, blurAmt);

                    sum += texture2D(tDiffuse, vUv) * 0.24;
                    sum += texture2D(tDiffuse, vUv + offX) * 0.12;
                    sum += texture2D(tDiffuse, vUv - offX) * 0.12;
                    sum += texture2D(tDiffuse, vUv + offY) * 0.12;
                    sum += texture2D(tDiffuse, vUv - offY) * 0.12;
                    sum += texture2D(tDiffuse, vUv + offX + offY) * 0.07;
                    sum += texture2D(tDiffuse, vUv - offX + offY) * 0.07;
                    sum += texture2D(tDiffuse, vUv + offX - offY) * 0.07;
                    sum += texture2D(tDiffuse, vUv - offX - offY) * 0.07;

                    vec2 vigUv = max(vUv * (1.0 - vUv.yx), vec2(0.0001));
                    float vig = pow(vigUv.x * vigUv.y * 16.0, 0.14);
                    gl_FragColor = vec4(sum.rgb * mix(0.88, 1.0, vig), sum.a);
                }
            `
        };

        const tiltShiftPass = new ShaderPass(TiltShiftShader);
        composer.addPass(tiltShiftPass);
        composer.addPass(new OutputPass());

        function applyEnvironmentState() {
            const m = MOODS[currentMoodKey];
            const w = WEATHERS[currentWeatherKey];

            document.getElementById('mood-subtitle').textContent =
                currentWeatherKey === 'rain' ? `${m.subtitle} • Mưa Đêm Phản Chiếu` :

            const skyCol = new THREE.Color(m.skyColor).lerp(new THREE.Color(0x0f172a), w.skyDarken);
            const fogCol = new THREE.Color(m.fogColor).lerp(new THREE.Color(0x1e293b), w.skyDarken);
            scene.background.copy(skyCol);

            hemiLight.color.setHex(m.hemiSky);

            dirLight.color.setHex(m.sunColor);
            dirLight.intensity = m.sunIntensity * w.sunMult;
            dirLight.position.set(...m.sunPos);

            mountainMeshes.forEach(pk => pk.material.color.setHex(m.mountainColor));

            rayUniforms.uColor.value.setHex(m.rayColor);
            rayUniforms.uOpacity.value = m.rayOpacity * (currentWeatherKey === 'rain' ? 0.45 : 1.0);

            waterUniforms.uDeepColor.value.setHex(m.waterDeep);
            waterUniforms.uShallowColor.value.setHex(m.waterShallow);
            waterUniforms.uRainIntensity.value = currentWeatherKey === 'rain' ? 1.0 : 0.0;
            waterUniforms.uLanternIntensity.value = m.waterLanternGlow;

            cobbleMat.roughness = w.cobbleRoughness;
            cobbleMat.metalness = w.cobbleMetalness;
            cobbleMat.color.setHex(w.cobbleTint);
            cobbleMat.needsUpdate = true;

            const wetBoost = currentWeatherKey === 'rain' ? 1.45 : 1.0;
            windowGlassMat.emissiveIntensity = m.windowEmissive * wetBoost;
            currentLampBoost = wetBoost;

            fireflyMat.opacity = m.fireflyOpacity;
            leafMat.color.setHex(m.leafColor);

            rainSystem.visible = w.rainOpacity > 0.01;
            mistUniforms.uTargetOpacity.value = w.mistOpacity;
            mistUniforms.uColor.value.setHex(m.mistColor);

            bloomPass.threshold = isNightMode ? 0.84 : 0.94;
            bloomPass.strength = currentMoodKey === 'night' ? Math.max(w.bloomBoost, 0.68) :
                                 currentMoodKey === 'calmNight' ? Math.max(w.bloomBoost, 0.48) : w.bloomBoost;

            // Festival Night Lantern Garlands & Area Lights
            const festVal = m.festivalGlow || 0.0;

        window.addEventListener('resize', () => {

            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);

        // =========================================================================
        // 12. REAL-TIME ANIMATION & PHYSICS LOOP
        // =========================================================================
        const clock = new THREE.Clock();
        const projVec = new THREE.Vector3();
        let lightningTimer = 4.0;

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.getElapsedTime();

            waterUniforms.uTime.value = elapsed;
            rayUniforms.uTime.value = elapsed;
            waterWheelGroup.rotation.x = elapsed * 1.15;

            // Lantern Flicker physically coupled to Wind Speed & Manual On/Off Switch
            const baseLampInt = MOODS[currentMoodKey].lampIntensity * currentLampBoost;
            interactiveLamps.forEach((lamp, idx) => {
                if (!lamp.isOn) {
                    lamp.light.intensity = 0;
                    lamp.bulbMat.emissiveIntensity = 0.05;
                    return;
                }
                const flicker = Math.sin(elapsed * (7.0 + windSpeed * 6.0) + idx * 2.1) * 0.14 * windSpeed;
                lamp.light.intensity = Math.max(0.2, baseLampInt + flicker);
                lamp.bulbMat.emissiveIntensity = MOODS[currentMoodKey].windowEmissive * 1.15;
            });

            // Animate Torii Shrine Spirit Crystal & Festival Lantern Garlands + Sky Fireworks
            shrineCrystal.rotation.y = elapsed * 1.4;
            shrineCrystal.position.y = 1.45 + Math.sin(elapsed * 2.6) * 0.12;

            festivalLanternMeshes.forEach(fl => {
                fl.mesh.position.y = fl.baseY + Math.sin(elapsed * 2.2 + fl.phase) * 0.04;
                fl.mesh.rotation.z = Math.sin(elapsed * (1.8 + windSpeed) + fl.phase) * 0.12 * windSpeed;
            });

            if (currentMoodKey === 'night') {
                fwState.timer -= dt;
                if (!fwState.active && fwState.timer <= 0) {
                    launchFirework();
                    fwState.timer = 1.4 + Math.random() * 1.8;
                }
                if (fwState.active) {
                    fwState.life -= dt;
                    fwMat.opacity = Math.max(0, Math.min(1, fwState.life * 1.1));
                    const fPos = fwGeo.attributes.position;
                    for (let i = 0; i < fwSparkCount; i++) {
                        const v = fwState.velocities[i];
                        v.y -= 2.4 * dt;
                        v.multiplyScalar(0.985);
                        fPos.setXYZ(
                            i,
                            fPos.getX(i) + v.x * dt,
                            fPos.getY(i) + v.y * dt,
                            fPos.getZ(i) + v.z * dt
                        );
                    }
                    fPos.needsUpdate = true;
                    if (fwState.life <= 0) {
                        fwState.active = false;
                        fireworkSystem.visible = false;
                    }
                }
            }

            // Update Villager NPCs & Check Proximity for RPG Interaction
            let foundTarget = null;
            let bestDist = 2.1;

            npcList.forEach(npc => {
                npc.timer += dt;
                if (npc.timer > 0.52) {
                    npc.frame = (npc.frame + 1) % npc.anims.idle.length;
                    npc.mat.map = npc.anims.idle[npc.frame];
                    npc.timer = 0;
                }
                npc.mesh.quaternion.copy(camera.quaternion);
                npc.mesh.scale.x = npc.facing;
                npc.bubbleMesh.quaternion.copy(camera.quaternion);
                npc.bubbleMesh.position.y = 1.52 + Math.sin(elapsed * 4.0 + npc.x) * 0.06;

                const d = Math.hypot(heroPivot.position.x - npc.x, heroPivot.position.z - npc.z);
                if (d < bestDist) {
                    bestDist = d;
                    foundTarget = { type: 'npc', target: npc };
                }
            });

            if (!foundTarget) {
                interactiveLamps.forEach(lamp => {
                    const d = Math.hypot(heroPivot.position.x - lamp.x, heroPivot.position.z - lamp.z);
                    if (d < 1.75 && d < bestDist) {
                        bestDist = d;
                        foundTarget = { type: 'lamp', target: lamp };
                    }
                });
            }

            nearestInteractable = foundTarget;
            if (nearestInteractable && !activeDialogue) {
                interactHintEl.classList.remove('hidden');
                if (nearestInteractable.type === 'npc') {
                    interactHintEl.innerHTML = `Nhấn <span class="pixel-font text-amber-400 font-bold">[E]</span> hoặc chạm để trò chuyện với <b>${nearestInteractable.target.name}</b>`;
                } else {
                    const stateTxt = nearestInteractable.target.isOn ? 'Tắt' : 'Bật';
                    interactHintEl.innerHTML = `Nhấn <span class="pixel-font text-amber-400 font-bold">[E]</span> hoặc chạm để <b>${stateTxt} ${nearestInteractable.target.name}</b>`;
                }
            } else {
                interactHintEl.classList.add('hidden');
            }

            // Typewriter Text Effect when Dialogue Box is Open
            if (activeDialogue && activeDialogue.charIdx < activeDialogue.fullText.length) {
                activeDialogue.timer += dt;
                if (activeDialogue.timer >= 0.024) {
                    activeDialogue.charIdx++;
                    dialogueTextEl.textContent = activeDialogue.fullText.slice(0, activeDialogue.charIdx);
                    activeDialogue.timer = 0;
                }
            }

            // Update Autonomous Roaming Animals (Dogs, Cats, Chickens)
            animalList.forEach(a => {
                a.mesh.quaternion.copy(camera.quaternion);
                a.mesh.scale.x = a.facing;

                const dx = a.targetX - a.mesh.position.x;
                const dz = a.targetZ - a.mesh.position.z;
                const dist = Math.hypot(dx, dz);

                if (dist > 0.12) {
                    const vx = (dx / dist) * a.speed * dt;
                    const vz = (dz / dist) * a.speed * dt;
                    const nextX = a.mesh.position.x + vx;
                    const nextZ = a.mesh.position.z + vz;
                    const surfY = getWalkableSurfaceY(nextX, nextZ);
                    if (surfY !== null && Math.abs(nextX) > 2.75) {
                        a.mesh.position.x = nextX;
                        a.mesh.position.z = nextZ;
                        a.mesh.position.y = surfY + a.size * 0.45 + Math.abs(Math.sin(elapsed * 12)) * 0.04;
                        a.facing = vx < 0 ? -1 : 1;
                    } else {
                        a.waitTimer = 0.2;
                        a.targetX = a.mesh.position.x;
                        a.targetZ = a.mesh.position.z;
                    }
                    a.animTimer += dt;
                    if (a.animTimer > 0.18) {
                        a.frameIdx = (a.frameIdx + 1) % a.frames.length;
                        a.mat.map = a.frames[a.frameIdx];
                        a.animTimer = 0;
                    }
                } else {
                    a.mat.map = a.frames[0];
                    a.waitTimer -= dt;
                    if (a.waitTimer <= 0) {
                        const ang = Math.random() * Math.PI * 2;
                        const rad = 0.8 + Math.random() * a.roamRadius;
                        const candX = a.homeX + Math.cos(ang) * rad;
                        const candZ = a.homeZ + Math.sin(ang) * rad;
                        if (getWalkableSurfaceY(candX, candZ) !== null && Math.abs(candX) > 2.8) {
                            a.targetX = candX;
                            a.targetZ = candZ;
                        }
                        a.waitTimer = 1.2 + Math.random() * 2.6;
                    }
                }
            });

            // 1. Compute Movement Vector (Paused while reading NPC dialogue)
            let moveX = activeDialogue ? 0 : joystickInput.x;
            let moveZ = activeDialogue ? 0 : joystickInput.z;
            if (!activeDialogue) {
                if (keysPressed['KeyA'] || keysPressed['ArrowLeft']) moveX -= 1;
                if (keysPressed['KeyD'] || keysPressed['ArrowRight']) moveX += 1;
                if (keysPressed['KeyW'] || keysPressed['ArrowUp']) moveZ -= 1;
                if (keysPressed['KeyS'] || keysPressed['ArrowDown']) moveZ += 1;
            }

            let isMoving = false;
            const moveSpeed = 3.8;

            if (Math.hypot(moveX, moveZ) > 0.08) {
                const len = Math.hypot(moveX, moveZ);
                moveX /= len;
                moveZ /= len;
                isMoving = true;
            } else if (clickTarget) {
                const dx = clickTarget.x - heroPivot.position.x;
                const dz = clickTarget.z - heroPivot.position.z;
                const dist = Math.hypot(dx, dz);
                if (dist > 0.14) {
                    moveX = dx / dist;
                    moveZ = dz / dist;
                    isMoving = true;
                } else {
                    clickTarget = null;
                    targetRing.visible = false;
                }
            }

            // 2. Apply Terrain Collision & Bridge Arch Height
            if (isMoving) {
                if (moveX < -0.05) heroFacing = -1;
                if (moveX > 0.05) heroFacing = 1;

                const stepX = moveX * moveSpeed * dt;
                const stepZ = moveZ * moveSpeed * dt;

                const tryBothY = getWalkableSurfaceY(heroPivot.position.x + stepX, heroPivot.position.z + stepZ);
                if (tryBothY !== null) {
                    heroPivot.position.x += stepX;
                    heroPivot.position.z += stepZ;
                    heroPivot.position.y = tryBothY;
                } else {
                    const tryXY = getWalkableSurfaceY(heroPivot.position.x + stepX, heroPivot.position.z);
                    if (tryXY !== null) {
                        heroPivot.position.x += stepX;
                        heroPivot.position.y = tryXY;
                    } else {
                        const tryZY = getWalkableSurfaceY(heroPivot.position.x, heroPivot.position.z + stepZ);
                        if (tryZY !== null) {
                            heroPivot.position.z += stepZ;
                            heroPivot.position.y = tryZY;
                        } else {
                            clickTarget = null;
                            targetRing.visible = false;
                        }
                    }
                }

                stepDustTimer += dt;
                if (stepDustTimer > 0.22) {
                    spawnFootstepDust(heroPivot.position.x, heroPivot.position.y, heroPivot.position.z);
                    stepDustTimer = 0;
                }
            }

            // 3. Update Hero Sprite Animation & Billboard Orientation
            heroAnimTimer += dt;
            if (isMoving) {
                if (heroAnimTimer > 0.13) {
                    heroAnimFrame = (heroAnimFrame + 1) % heroAnims.walk.length;
                    heroMat.map = heroAnims.walk[heroAnimFrame];
                    heroAnimTimer = 0;
                }
            } else {
                if (heroAnimTimer > 0.45) {
                    heroAnimFrame = (heroAnimFrame + 1) % heroAnims.idle.length;
                    heroMat.map = heroAnims.idle[heroAnimFrame];
                    heroAnimTimer = 0;
                }
            }
            heroMesh.quaternion.copy(camera.quaternion);
            heroMesh.scale.x = heroFacing;

            if (targetRing.visible) {
                targetRing.rotation.z = elapsed * 2.5;
                const s = 0.85 + Math.sin(elapsed * 6.0) * 0.15;
                targetRing.scale.set(s, s, 1);
            }

            dustPool.forEach(d => {
                if (d.life > 0) {
                    d.life -= dt;
                    d.mesh.position.x += d.vx * dt;
                    d.mesh.position.y += d.vy * dt;
                    d.mesh.position.z += d.vz * dt;
                    d.mesh.material.opacity = Math.max(0, d.life * 1.8);
                    if (d.life <= 0) d.mesh.visible = false;
                }
            });

            // 4. Camera Follow & Dynamic Tilt-Shift Focus Tracking
            if (cameraMode === 'follow') {
                const desiredCamPos = new THREE.Vector3(
                    heroPivot.position.x * 0.82,
                    heroPivot.position.y + 8.8,
                    heroPivot.position.z + 15.2
                );
                camera.position.lerp(desiredCamPos, 4.5 * dt);
                const lookTarget = new THREE.Vector3(
                    heroPivot.position.x,
                    heroPivot.position.y + 0.85,
                    heroPivot.position.z - 0.5
                );
                camera.lookAt(lookTarget);
            } else {
                controls.update();
            }

            projVec.copy(heroPivot.position).add(new THREE.Vector3(0, 0.7, 0)).project(camera);
            const screenY = THREE.MathUtils.clamp((projVec.y + 1) * 0.5, 0.2, 0.8);
            tiltShiftPass.uniforms.uFocusY.value = screenY;

            // 5. Wind Swaying Foliage & Bushes (Physically Coupled to Wind Speed)
            foliageSprites.forEach(item => {
                item.mesh.quaternion.copy(camera.quaternion);
                item.mesh.position.x = item.baseX + Math.sin(elapsed * (1.8 + windSpeed * 1.1) + item.phase) * 0.08 * windSpeed;
            });

            swayingBushes.forEach(b => {
                b.mesh.quaternion.copy(camera.quaternion);
                b.mesh.position.x = b.baseX + Math.sin(elapsed * (2.2 + windSpeed * 1.2) + b.phase) * 0.06 * windSpeed;
            });

            // 6. Animate Falling Leaves
            const lAttr = leafGeo.attributes.position;
            for (let i = 0; i < leafCount; i++) {
                let lx = lAttr.getX(i);
                let ly = lAttr.getY(i);
                let lz = lAttr.getZ(i);

                ly -= leafData[i].vy * (0.4 + windSpeed * 0.7) * dt;
                lx += Math.sin(elapsed * 1.4 + leafData[i].phase) * 0.35 * windSpeed * dt + 0.14 * windSpeed * dt;
                lz += Math.cos(elapsed * 1.1 + leafData[i].phase) * 0.2 * windSpeed * dt;

                if (ly < 0.25) {
                    ly = 7.5 + Math.random() * 2.5;
                    lx = (Math.random() - 0.5) * 36;
                    lz = (Math.random() - 0.5) * 30 - 3;
                }
                lAttr.setXYZ(i, lx, ly, lz);
            }
            lAttr.needsUpdate = true;

            // 7. Animate Fireflies
            const fAttr = fireflyGeo.attributes.position;
            for (let i = 0; i < fireflyCount; i++) {
                const d = fireflyData[i];
                const fx = d.bx + Math.sin(elapsed * d.speed + d.phase) * 0.75;
                const fy = d.by + Math.cos(elapsed * d.speed * 1.2 + d.phase) * 0.45;
                const fz = d.bz + Math.sin(elapsed * d.speed * 0.8 + d.phase) * 0.75;
                fAttr.setXYZ(i, fx, fy, fz);
            }
            fAttr.needsUpdate = true;

            // 8. Animate 3D Slanted Rain Streaks & Distant Storm Lightning
            if (rainSystem.visible) {
                const rAttr = rainGeo.attributes.position;
                const windSlantX = 1.6 + windSpeed * 2.4;
                for (let i = 0; i < rainCount; i++) {
                    const drop = rainDrops[i];
                    drop.y -= drop.speed * dt;
                    drop.x += windSlantX * dt;
                    if (drop.y < 0.15) {
                        drop.y = 14.5 + Math.random() * 2.5;
                        drop.x = (Math.random() - 0.5) * 38 - windSlantX * 0.4;
                    }
                    rAttr.setXYZ(i * 2, drop.x, drop.y, drop.z);
                    rAttr.setXYZ(i * 2 + 1, drop.x - windSlantX * 0.035, drop.y - 0.52, drop.z);
                }
                rAttr.needsUpdate = true;

                if (windSpeed >= 1.6) {
                    lightningTimer -= dt;
                    if (lightningTimer <= 0) {
                        lightningLight.intensity = 6.5;
                        lightningTimer = 4.5 + Math.random() * 6.0;
                    }
                }
            }
            if (lightningLight.intensity > 0.01) {
                lightningLight.intensity *= 0.82;
            } else {
                lightningLight.intensity = 0;
            }

            // 9. Animate Volumetric Ground Mist Layers
            mistLayers.forEach(m => {
                m.mat.opacity = THREE.MathUtils.lerp(m.mat.opacity, mistUniforms.uTargetOpacity.value, 3.0 * dt);
                m.mat.color.copy(mistUniforms.uColor.value);
                if (m.mat.opacity > 0.01) {
                    m.mesh.position.x = m.baseX + Math.sin(elapsed * m.speed * (0.5 + windSpeed * 0.5) + m.phase) * 3.8;
                }
            });

            composer.render();
        }

        // Start default bright morning mood & animation loop
        applyEnvironmentState();
        animate();
    </script>
</body>
